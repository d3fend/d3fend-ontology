<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3FEND Ontological Modeling Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #617080;
      --line: #dce2e8;
      --good: #167a55;
      --warn: #a56700;
      --bad: #b42318;
      --accent: #235789;
      --soft: #e9eef4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      padding: 28px 0 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    main {
      padding: 24px 0 42px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .metric,
    .framework,
    .table-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .metric {
      padding: 16px;
      min-height: 92px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .metric .value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .frameworks {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .framework {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .framework-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      background: var(--soft);
      color: var(--accent);
    }

    .badge.good {
      background: #e4f4ed;
      color: var(--good);
    }

    .badge.warn {
      background: #fff2d9;
      color: var(--warn);
    }

    .badge.bad {
      background: #fde7e4;
      color: var(--bad);
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 10px;
      background: #f9fafb;
      border: 1px solid #edf0f3;
      border-radius: 6px;
    }

    .stat b {
      display: block;
      font-size: 18px;
      line-height: 1.2;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .version {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .version b {
      color: var(--ink);
      font-weight: 700;
    }

    .framework-actions {
      display: flex;
      justify-content: end;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      padding: 7px 10px;
      font-weight: 650;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .detail-panel {
      margin-top: 22px;
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .detail-head h2 {
      padding: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1.1fr) minmax(120px, 0.5fr) minmax(220px, 1fr);
      gap: 10px;
      padding: 14px 16px;
      background: #fafbfc;
      border-bottom: 1px solid var(--line);
    }

    .control {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .control span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select,
    input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 8px 9px;
    }

    .row-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #fde7e4;
      color: var(--bad);
    }

    .status-pill.mapped {
      background: #e4f4ed;
      color: var(--good);
    }

    .item-title {
      font-weight: 700;
      line-height: 1.3;
    }

    .item-title a {
      color: var(--ink);
      text-decoration-color: var(--line);
      text-underline-offset: 3px;
    }

    .item-title a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .item-meta,
    .mapping-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .mapping-list {
      display: grid;
      gap: 7px;
    }

    .mapping-list div {
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .mapping-list b {
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .table-panel {
      overflow: hidden;
    }

    .table-panel h2 {
      padding: 16px 16px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    th,
    td {
      padding: 11px 16px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0;
      background: #fafbfc;
    }

    td.num,
    th.num {
      text-align: right;
    }

    .empty,
    .error {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }

    .error {
      color: var(--bad);
    }

    @media (max-width: 920px) {
      .summary,
      .frameworks {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(100% - 20px, 1180px);
      }

      .topbar {
        display: block;
        padding: 20px 0 18px;
      }

      .summary,
      .frameworks,
      .stats {
        grid-template-columns: 1fr;
      }

      .detail-head {
        display: block;
      }

      .row-count {
        display: block;
        margin-top: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>D3FEND Ontological Modeling Dashboard</h1>
        <p class="meta" id="sourceMeta">Loading dashboard-report.json</p>
      </div>
      <p class="meta" id="buildMeta"></p>
    </div>
  </header>
  <main class="wrap">
    <section class="summary" id="summary"></section>
    <section class="frameworks" id="frameworks"></section>
    <section class="table-panel detail-panel" id="detailPanel">
      <div class="detail-head">
        <div>
          <h2 id="detailTitle">Mapping Details</h2>
          <p class="meta" id="detailMeta"></p>
        </div>
        <span class="row-count" id="detailCount"></span>
      </div>
      <div class="controls">
        <label class="control">
          <span>Framework</span>
          <select id="frameworkFilter"></select>
        </label>
        <label class="control">
          <span>Status</span>
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="mapped">Mapped</option>
            <option value="unmapped">Unmapped</option>
          </select>
        </label>
        <label class="control">
          <span>Search</span>
          <input id="searchFilter" type="search" placeholder="Label, ID, relation, or target">
        </label>
      </div>
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Item</th>
            <th>Mappings</th>
          </tr>
        </thead>
        <tbody id="detailRows"></tbody>
      </table>
    </section>
    <section class="table-panel" id="relationPanel">
      <h2>Relationship Mix</h2>
      <table>
        <thead>
          <tr>
            <th>Framework</th>
            <th>Most Used Relations</th>
            <th class="num">Edges</th>
          </tr>
        </thead>
        <tbody id="relationRows"></tbody>
      </table>
    </section>
  </main>

  <script>
    const nf = new Intl.NumberFormat();
    let activeReport = null;
    let selectedFrameworkId = "";

    function pct(value) {
      return value === null || value === undefined ? "n/a" : `${Math.round(value)}%`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function badgeClass(value) {
      if (value === null || value === undefined) return "";
      if (value >= 85) return "good";
      if (value >= 50) return "warn";
      return "bad";
    }

    function metric(label, value) {
      return `<article class="metric"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></article>`;
    }

    function itemSearchText(item) {
      const relations = (item.relations || [])
        .map((relation) => `${relation.predicate_label} ${relation.target_label} ${relation.target_compact_iri}`)
        .join(" ");
      return `${item.label || ""} ${item.external_id || ""} ${item.compact_iri || ""} ${item.source_version || ""} ${item.url || ""} ${relations}`.toLowerCase();
    }

    function relationLabel(item) {
      const entries = item.relations_by_predicate || [];
      if (!entries.length) return "None";
      return entries
        .slice(0, 4)
        .map((entry) => `${escapeHtml(entry.label)} (${nf.format(entry.count)})`)
        .join(", ");
    }

    function renderFramework(item) {
      const coverage = item.coverage_percent;
      const barWidth = coverage === null || coverage === undefined ? 0 : Math.max(0, Math.min(100, coverage));
      const version = item.source_version || "unknown";
      const targetMarkup = item.target_count === undefined
        ? ""
        : `<span>Targets</span><b>${nf.format(item.target_count)}</b>`;

      return `
        <article class="framework" data-framework-id="${escapeHtml(item.id)}">
          <div class="framework-head">
            <h2>${escapeHtml(item.label)}</h2>
            <span class="badge ${badgeClass(coverage)}">${pct(coverage)}</span>
          </div>
          <div class="version"><span>Version</span><b>${escapeHtml(version)}</b>${targetMarkup}</div>
          <div class="bar" aria-hidden="true"><span style="width:${barWidth}%"></span></div>
          <div class="stats">
            <div class="stat"><b>${nf.format(item.included_count)}</b><span>Included</span></div>
            <div class="stat"><b>${nf.format(item.integrated_count)}</b><span>Mapped</span></div>
            <div class="stat"><b>${nf.format(item.unmapped_count || 0)}</b><span>Unmapped</span></div>
            <div class="stat"><b>${nf.format(item.relationship_count)}</b><span>Edges</span></div>
          </div>
          <div class="framework-actions">
            <button type="button" data-detail-id="${escapeHtml(item.id)}">Details</button>
          </div>
        </article>
      `;
    }

    function frameworkOptions(frameworks) {
      return frameworks
        .map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.label)}</option>`)
        .join("");
    }

    function mappingMarkup(item) {
      const relations = item.relations || [];
      if (!relations.length) return `<span class="muted">Unmapped</span>`;
      return `<div class="mapping-list">${relations.map((relation) => `
        <div>
          <b>${escapeHtml(relation.predicate_label)}</b>
          &rarr; ${escapeHtml(relation.target_label)}
          <div class="mapping-meta">${escapeHtml(relation.target_compact_iri || relation.target)}</div>
        </div>
      `).join("")}</div>`;
    }

    function itemTitleMarkup(item) {
      const label = escapeHtml(item.label || item.compact_iri);
      if (!item.url) return label;
      return `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    }

    function itemMetaMarkup(item) {
      const values = [
        item.external_id,
        item.compact_iri,
        item.source_version ? `Version: ${item.source_version}` : ""
      ]
        .filter(Boolean);
      return escapeHtml([...new Set(values)].join(" | "));
    }

    function renderDetailRows(framework) {
      const status = document.getElementById("statusFilter").value;
      const search = document.getElementById("searchFilter").value.trim().toLowerCase();
      const items = framework.items || [];
      const filtered = items.filter((item) => {
        if (status === "mapped" && !item.mapped) return false;
        if (status === "unmapped" && item.mapped) return false;
        if (search && !itemSearchText(item).includes(search)) return false;
        return true;
      });

      document.getElementById("detailCount").textContent = `${nf.format(filtered.length)} of ${nf.format(items.length)} items`;
      document.getElementById("detailRows").innerHTML = filtered.length
        ? filtered.map((item) => `
          <tr>
            <td><span class="status-pill ${item.mapped ? "mapped" : ""}">${item.mapped ? "Mapped" : "Unmapped"}</span></td>
            <td>
              <div class="item-title">${itemTitleMarkup(item)}</div>
              <div class="item-meta">${itemMetaMarkup(item)}</div>
            </td>
            <td>${mappingMarkup(item)}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="3" class="muted">No rows match the current filters.</td></tr>`;
    }

    function renderDetails() {
      const frameworks = activeReport.frameworks || [];
      const framework = frameworks.find((item) => item.id === selectedFrameworkId) || frameworks[0];
      if (!framework) return;

      selectedFrameworkId = framework.id;
      document.getElementById("frameworkFilter").value = framework.id;
      document.getElementById("detailTitle").textContent = `${framework.label} Mapping Details`;
      document.getElementById("detailMeta").textContent = `Version: ${framework.source_version || "unknown"} | Mapped: ${nf.format(framework.integrated_count)} | Unmapped: ${nf.format(framework.unmapped_count || 0)} | Edges: ${nf.format(framework.relationship_count)}`;
      renderDetailRows(framework);
    }

    function render(report) {
      activeReport = report;
      const frameworks = report.frameworks || [];
      const totals = report.totals || {};
      selectedFrameworkId = selectedFrameworkId || (frameworks[0] ? frameworks[0].id : "");
      document.getElementById("sourceMeta").textContent = `Source: ${report.source_path}`;
      document.getElementById("buildMeta").textContent = `Generated: ${report.generated_at}`;
      document.getElementById("summary").innerHTML = [
        metric("Frameworks", nf.format(frameworks.length)),
        metric("Included Items", nf.format(totals.included_count || 0)),
        metric("Mapped Items", nf.format(totals.integrated_count || 0)),
        metric("Relationships", nf.format(totals.relationship_count || 0))
      ].join("");

      document.getElementById("frameworks").innerHTML = frameworks.length
        ? frameworks.map(renderFramework).join("")
        : `<div class="empty">No framework entries found.</div>`;

      document.getElementById("frameworkFilter").innerHTML = frameworkOptions(frameworks);
      renderDetails();

      document.getElementById("relationRows").innerHTML = frameworks.map((item) => `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td>${relationLabel(item)}</td>
          <td class="num">${nf.format(item.relationship_count)}</td>
        </tr>
      `).join("");
    }

    document.getElementById("frameworks").addEventListener("click", (event) => {
      const button = event.target.closest("[data-detail-id]");
      if (!button) return;
      selectedFrameworkId = button.dataset.detailId;
      renderDetails();
      document.getElementById("detailPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    document.getElementById("frameworkFilter").addEventListener("change", (event) => {
      selectedFrameworkId = event.target.value;
      renderDetails();
    });

    document.getElementById("statusFilter").addEventListener("change", renderDetails);
    document.getElementById("searchFilter").addEventListener("input", renderDetails);

    fetch("./dashboard-report.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        document.querySelector("main").innerHTML = `<div class="error">Could not load dashboard-report.json: ${error.message}</div>`;
      });
  </script>
</body>
</html>
