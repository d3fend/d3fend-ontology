stages:
  - deploy

pages:
  stage: deploy
  variables:
    PIPENV_PYTHON: python3.11
    PIPENV_VENV_IN_PROJECT: "1"
  script:
    - |
      set -euo pipefail

      if command -v python3.11 >/dev/null 2>&1; then
        export PATH="$HOME/.local/bin:$PATH"
        python3.11 --version
        if ! command -v pipenv >/dev/null 2>&1; then
          python3.11 -m pip install --user pipenv==2026.6.1
        fi
        pipenv --version
        make install-python-deps
        make dashboard
      elif command -v docker >/dev/null 2>&1; then
        mkdir -p .local/ci-certs
        if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ] && [ -f "$CI_SERVER_TLS_CA_FILE" ]; then
          cp "$CI_SERVER_TLS_CA_FILE" .local/ci-certs/ci-server-ca.crt
        fi
        for cert_dir in /etc/pki/ca-trust/source/anchors /usr/local/share/ca-certificates; do
          if [ -d "$cert_dir" ]; then
            find "$cert_dir" -maxdepth 1 -type f \( -name '*.crt' -o -name '*.pem' \) -exec cp {} .local/ci-certs/ \;
          fi
        done
        export DASHBOARD_IMAGE="d3fend-ontology-toolchain:${CI_COMMIT_SHORT_SHA}"
        docker build --target ontology-toolchain -t "$DASHBOARD_IMAGE" .
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e PIPENV_PYTHON=/usr/bin/python3.11 \
          -e PIPENV_VENV_IN_PROJECT=1 \
          -v "$PWD:/app" \
          -w /app \
          "$DASHBOARD_IMAGE" \
          bash -lc 'make install-python-deps && make dashboard'
      else
        echo "The GitLab runner needs python3.11 or docker to build the dashboard."
        exit 1
      fi
    - rm -rf public
    - mkdir -p public
    - cp -R dist/dashboard/. public/
  artifacts:
    paths:
      - public
      - reports/dashboard-report.json

# Ontology -> Builder pipeline: overwrite SPARQL query cache in builder.
#
# The downstream builder pipeline rebuilds the site using this ontology ref and
# refreshes the shared Redis-backed SPARQL query cache for this branch.
deploy-builder:
  stage: deploy
  trigger:
    project: D3FEND/d3fend-builder
  variables:
    ONTOLOGY_REF: $CI_COMMIT_REF_NAME
    QUERY_CACHE_MODE: "OVERWRITE"
    ROUTE_CACHE_MODE: "DISABLED"
    CACHE: redis
